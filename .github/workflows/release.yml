name: Release

# Push a tag like v0.1.0 to publish a release with the web build attached.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: cd dist && zip -r ../web-build.zip .
      # TODO(android): build the APK with Capacitor here and attach it too.
      - run: gh release create "$GITHUB_REF_NAME" web-build.zip --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
